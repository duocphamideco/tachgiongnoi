<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IDECO - Tách Audio từ YouTube</title>
<style>
:root{--red:#d71920;--red2:#b31319;--bg:#f5f7fb;--text:#182033;--muted:#64748b;--line:#dfe5ec}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#f8fafc,#eef3f8);color:var(--text)}
.wrap{max-width:760px;margin:0 auto;padding:34px 16px}
.head{display:flex;gap:14px;align-items:center;margin-bottom:18px}
.logo{width:64px;height:64px;border-radius:17px;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:900}
h1{font-size:25px;margin:0}.sub{margin-top:6px;color:var(--muted);line-height:1.5}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 14px 40px #0f172a12}
label{display:block;font-weight:800;margin-bottom:8px}
.row{display:grid;grid-template-columns:1fr 170px;gap:10px}
input{width:100%;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:16px;outline:none}
input:focus{border-color:var(--red);box-shadow:0 0 0 3px #d7192015}
button{border:0;border-radius:12px;padding:14px 16px;font-weight:900;font-size:15px;cursor:pointer}
.primary{background:var(--red);color:#fff}.primary:hover{background:var(--red2)}
.primary:disabled{opacity:.45;cursor:not-allowed}
.status{display:none;margin-top:17px;padding:13px 14px;border-radius:12px;background:#f8fafc;color:#475569;line-height:1.55}
.error{background:#fff1f2;color:#b91c1c}
.ok{background:#ecfdf5;color:#15803d}
.result{display:none;margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}
audio{width:100%;margin:10px 0 14px}
.download{display:block;text-align:center;text-decoration:none;background:#111827;color:white;border-radius:12px;padding:14px;font-weight:900}
.note{margin-top:16px;font-size:12px;color:var(--muted);line-height:1.55}
@media(max-width:620px){.row{grid-template-columns:1fr}.card{padding:17px}h1{font-size:21px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="logo">IDECO</div>
    <div>
      <h1>TÁCH AUDIO TỪ LINK YOUTUBE</h1>
      <div class="sub">Dán link → bấm TÁCH AUDIO → nghe thử → tải MP3.</div>
    </div>
  </div>

  <div class="card">
    <label for="url">Link video YouTube</label>
    <div class="row">
      <input id="url" type="url" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off">
      <button class="primary" id="extract">🎵 TÁCH AUDIO</button>
    </div>

    <div class="status" id="status"></div>

    <div class="result" id="result">
      <b id="title"></b>
      <audio id="audio" controls preload="metadata"></audio>
      <a class="download" id="download" href="#">⬇️ TẢI FILE MP3</a>
    </div>

    <div class="note">
      Chỉ xử lý video mà anh sở hữu hoặc được phép tải/chuyển đổi. Ứng dụng cần chạy cùng backend đi kèm;
      GitHub Pages thuần chỉ hiển thị giao diện và không tự lấy audio từ YouTube.
    </div>
  </div>
</div>

<script>
const API = ''; // Nếu frontend và backend khác domain, điền URL backend, VD: https://abc.onrender.com
const $ = id => document.getElementById(id);
const btn=$('extract'), url=$('url'), status=$('status'), result=$('result'),
      audio=$('audio'), download=$('download'), title=$('title');

function showStatus(text,type=''){
  status.style.display='block';
  status.className='status '+type;
  status.textContent=text;
}
function validYouTube(u){
  try{
    const x=new URL(u);
    return ['youtube.com','www.youtube.com','m.youtube.com','youtu.be'].includes(x.hostname);
  }catch{return false}
}

btn.onclick=async()=>{
  const u=url.value.trim();
  result.style.display='none';
  audio.removeAttribute('src');
  if(!validYouTube(u)){ showStatus('Vui lòng dán đúng link YouTube.','error'); return; }

  btn.disabled=true;
  showStatus('Đang lấy và chuyển audio sang MP3…');
  try{
    const r=await fetch(API+'/api/extract',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({url:u})
    });
    const data=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(data.error||'Không tách được audio.');

    title.textContent=data.title||'Audio đã sẵn sàng';
    const fileUrl=API+data.fileUrl;
    audio.src=fileUrl;
    download.href=fileUrl;
    download.download=(data.filename||'youtube_audio.mp3');
    result.style.display='block';
    showStatus('✅ Hoàn tất. Anh có thể nghe thử hoặc tải MP3.','ok');
  }catch(e){
    showStatus('Không thực hiện được: '+e.message,'error');
  }finally{
    btn.disabled=false;
  }
};

url.addEventListener('keydown',e=>{if(e.key==='Enter')btn.click()});
</script>
</body>
</html>
